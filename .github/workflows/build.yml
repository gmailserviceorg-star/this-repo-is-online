name: build-stratum
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
jobs:
  launchers:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, kind: linux }
          - { os: ubuntu-latest, kind: windows }
          - { os: macos-latest, kind: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/launchers.sh ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        with: { name: "launcher-${{ matrix.kind }}", path: out-launcher/ }
  iso:
    runs-on: ubuntu-24.04
    needs: launchers
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-unknown-linux-musl }
      - name: deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libssl-dev libelf-dev libncurses-dev cpio zstd xz-utils jq curl \
            squashfs-tools xorriso mtools grub-pc-bin grub-efi-amd64-bin grub-common busybox-static imagemagick fonts-dejavu-core \
            musl-tools qemu-system-x86 kmod memtest86+
      - uses: actions/cache@v4
        with:
          path: build/k/linux-*.tar.xz
          key: kernel-${{ hashFiles('kernel/*.config','drivers/*.config','network/*.config') }}
      - run: bash scripts/10-rust.sh
      - run: bash scripts/20-kernel.sh
      - run: bash scripts/40-initramfs.sh
      - run: bash scripts/30-rootfs.sh
        env: { STRATUM_SIGNING_KEY: "${{ secrets.STRATUM_SIGNING_KEY }}" }
      - uses: actions/download-artifact@v4
        with: { path: build/launchers-dl, pattern: "launcher-*", merge-multiple: true }
      - run: mkdir -p build/launchers && cp -a build/launchers-dl/. build/launchers/
      - run: bash scripts/50-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: stratum-os-iso
          path: |
            build/stratum-os.iso
            build/size-report.txt
            build/skipped.txt
      - run: bash scripts/smoke.sh
        continue-on-error: true
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with: { files: build/stratum-os.iso }
